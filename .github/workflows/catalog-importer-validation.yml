name: Catalog importer validation

on:
  push:
    branches:
      - feature/catalog-importer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Keep package lock in sync on catalog branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/catalog-importer'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync catalog package lock"
            git push
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: catalog-package-lock
          path: package-lock.json
          overwrite: true
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Catalog importer smoke test
        run: npx --yes tsx scripts/catalog-importer-smoke.ts
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/metabot
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/metabot
          CATALOG_ADMIN_SECRET: validation-only-not-used-at-runtime
          DEMO_MODE: "true"
