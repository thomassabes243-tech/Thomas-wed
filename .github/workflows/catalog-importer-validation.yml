name: Catalog importer validation

on:
  push:
    branches:
      - feature/catalog-importer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: catalog-package-lock
          path: package-lock.json
          overwrite: true
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/metabot
          CATALOG_ADMIN_SECRET: validation-only-not-used-at-runtime
          DEMO_MODE: "true"
