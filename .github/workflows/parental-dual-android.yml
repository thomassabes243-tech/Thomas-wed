name: Build Parental Dual Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/parental-dual
    paths:
      - "android-parental-dual/**"
      - ".github/workflows/parental-dual-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-parental-dual :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parental-dual-debug-apk
          path: android-parental-dual/app/build/outputs/apk/debug/app-debug.apk
